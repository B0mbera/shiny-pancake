name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check src tests examples
          ruff format --check src tests examples
      - name: Tests (offline, no API key needed)
        run: pytest -q
      - name: Eval suite (offline provider)
        run: shiny-pancake eval evals/smoke.jsonl --offline --json eval-report.json
      - uses: actions/upload-artifact@v4
        if: always() && matrix.python-version == '3.12'
        with:
          name: eval-report
          path: eval-report.json

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t shiny-pancake:ci .
      - name: Smoke test the container
        run: |
          docker run -d --name hub -p 8000:8000 shiny-pancake:ci
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          curl -fs -X POST localhost:8000/run -H 'content-type: application/json' \
               -d '{"goal": "What is 12 * (3 + 4)?"}' | grep -q 84
          docker run --rm shiny-pancake:ci eval evals/smoke.jsonl --offline
      - if: always()
        run: docker logs hub || true
