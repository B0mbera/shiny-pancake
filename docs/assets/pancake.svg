  <circle cx="81.5" cy="98.5" r="2.3" fill="#FFFFFF"/>
  <circle cx="123.5" cy="98.5" r="2.3" fill="#FFFFFF"/>
  <path d="M92 105 Q100 113 108 105" fill="none" stroke="#3A2214" stroke-width="3.2" stroke-linecap="round"/>
