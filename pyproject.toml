[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shiny-pancake"
version = "0.2.0"
description = "A production-minded multi-agent LLM hub: orchestrator + specialist agents, multi-worker summarization, job queue, eval harness and MCP in both directions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Bence Bombera" }]
keywords = ["llm", "agents", "multi-agent", "orchestration", "summarization", "mcp", "claude", "harness"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # anthropic 2.x sends API version 2026-10-21 (no sampling params, httpx2 transport)
    "anthropic>=2.0,<3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    # used by the OpenAI-compatible provider (Ollama, vLLM, LM Studio, OpenAI); never handed to the Anthropic SDK
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]
# httpx2 is imported directly by the provider tests (it is the Anthropic SDK's HTTP layer)
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5", "mcp>=2.0,<3", "httpx2>=2.0"]

[project.scripts]
shiny-pancake = "shiny_pancake.cli:main"

[project.urls]
Homepage = "https://github.com/b0mbera/shiny-pancake"

[tool.hatch.build.targets.wheel]
packages = ["src/shiny_pancake"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
